<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; overflow:hidden;">
<canvas id="cvs" style="width:100vw; height:100vh; background:#eee;"></canvas>
<script>
    const cvs = document.getElementById('cvs');
    const ctx = cvs.getContext('2d');
    let viewState = { scale: 1, offsetX: 0, offsetY: 0, lastX: 0, lastY: 0, isDragging: false };
    
    function resize() {
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
        draw();
    }
    window.onresize = resize;
    
    function draw() {
        let width = cvs.width;
        let height = cvs.height;
        ctx.fillStyle = "#eee";
        ctx.fillRect(0,0,width,height);
        
        ctx.save();
        ctx.translate(viewState.offsetX, viewState.offsetY);
        ctx.translate(width/2, height/2);
        ctx.scale(viewState.scale, viewState.scale);
        ctx.translate(-width/2, -height/2);
        
        ctx.fillStyle = "red";
        ctx.fillRect(100, 100, 200, 200);
        ctx.fillStyle = "blue";
        ctx.fillRect(width/2 - 10, height/2 - 10, 20, 20);
        ctx.fillStyle = "green";
        ctx.fillRect(width - 300, height/2 - 50, 100, 100);
        
        ctx.restore();
    }
    
    cvs.addEventListener('wheel', (e) => {
        e.preventDefault();
        let zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
        let xs = e.clientX;
        let ys = e.clientY;
        let width = cvs.width;
        let height = cvs.height;
        
        let oldScale = viewState.scale;
        let newScale = oldScale * zoomFactor;
        let scaleRatio = newScale / oldScale;
        
        viewState.offsetX = xs - width/2 - (xs - width/2 - viewState.offsetX) * scaleRatio;
        viewState.offsetY = ys - height/2 - (ys - height/2 - viewState.offsetY) * scaleRatio;
        viewState.scale = newScale;
        
        draw();
    });
    
    cvs.addEventListener('mousedown', (e) => { viewState.isDragging = true; viewState.lastX = e.clientX; viewState.lastY = e.clientY; });
    window.addEventListener('mouseup', () => { viewState.isDragging = false; });
    cvs.addEventListener('mousemove', (e) => {
        if (!viewState.isDragging) return;
        viewState.offsetX += e.clientX - viewState.lastX; viewState.offsetY += e.clientY - viewState.lastY;
        viewState.lastX = e.clientX; viewState.lastY = e.clientY; draw();
    });
    
    resize();
</script>
</body>
</html>
